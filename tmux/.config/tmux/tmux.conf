# set prefix to leader+a
set -g prefix C-a

# set default terminal, added this to try and resolve some highlighting weirdness
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# source tmux conf
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# session rescue: snapshot the environment and rebuild it after a restart
# C-s saves now. C-r rebuilds anything missing from the last snapshot, so it is
# safe to press even while you are working. The scripts default to
# ~/.local/share/tmux/rescue and a 900s interval on their own; export
# TMUX_RESCUE_DIR / TMUX_RESCUE_INTERVAL in your shell to override either.
bind C-s run-shell '~/.config/tmux/scripts/rescue-save.sh'
bind C-r run-shell '~/.config/tmux/scripts/rescue-restore.sh'
# Start the auto-save daemon. Marks the server so the restore below runs only
# once per server, and the daemon locks itself so this is safe to repeat.
run-shell -b 'tmux set-environment -g TMUX_RESCUE_STARTED 1; ~/.config/tmux/scripts/rescue-init.sh'
# Covers the case where you start tmux before the login agent does: a bare
# session already exists, so the agent would skip, but a new server is exactly
# when a restore is wanted. Only runs when the marker is absent (first branch =
# marker set = a daemon already started on this server), and the marker goes
# away with the server.
if-shell -b '#{?TMUX_RESCUE_STARTED,1,0}' \
  '' 'run-shell -b "~/.config/tmux/scripts/rescue-restore.sh"'

# iterm2 clear screen and add to scrollback
bind-key k send-keys C-l

# vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# split panes using | and -
bind '\' split-window -h
bind '-' split-window -v
unbind '"'
unbind %

# start windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# list of plugins
# Plugins are git submodules inside this stow package (git submodule update
# --init installs them); TPM only sources them at runtime. Point TPM at the
# stowed directory instead of letting it fall back to ~/.tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# configure tinty theme
set -g @plugin 'tinted-theming/tinted-tmux'
run-shell "tmux set-option -g @tinted-color $(tinty current)"

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# transparent background - must be after TPM so tinted-tmux doesn't override it
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
